[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ntracks"
version = "2.2.0"
description = "N-TRACKS: Neutrophil Tracking & Recognition Analysis of Cell Kinetics & Shape — Hybrid Spatio-Temporal Volumetric & Markovian Engine"
authors = [
    { name = "Maxence Tricaud", email = "mtricaud.cetri@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pydantic>=2.0.0",
    "nd2>=0.8.0",
    "tifffile>=2022.5.0",
    "dask>=2022.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools]
packages = ["schemas", "extractors", "runners"]
